# fly launch --no-deploy --copy-config ; fly volumes create ateam_data --size 1 ; fly secrets set ATEAM_TOKEN=... ; ./bin/deploy
# Deploy with ./bin/deploy (not bare `fly deploy`) so the image knows its commit and GET /health can report it.
app = "ateam"
primary_region = "sin"

[build]
  dockerfile = "packages/server/Dockerfile"

[env]
  ATEAM_HUMAN = "human"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "ateam_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
