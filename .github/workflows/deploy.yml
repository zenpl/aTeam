# Deploys the server to Fly on every push to the `production` branch.
# Needs one repository secret: FLY_API_TOKEN (fly tokens create deploy -a ateam).
# Until that secret exists this workflow fails harmlessly and the human deploys by hand with ./bin/deploy.
name: deploy
on:
  push:
    branches: [production]
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -x bin/deploy ]; then ./bin/deploy --remote-only
          else flyctl deploy --remote-only --build-arg "GIT_SHA=$GITHUB_SHA"; fi
